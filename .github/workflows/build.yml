name: Build Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos and SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/* "$HOME/theos/sdks/"
          chmod -R 755 .

      - name: Compile Dylib
        run: |
          export THEOS="$HOME/theos"
          make FINALPACKAGE=1 THEOS="$HOME/theos" 2>&1 | tee make.log

      - name: Upload Dylib Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 34306jit-Dylib
          path: |
            .theos/obj/*.dylib
            .theos/obj/**/*.dylib
            packages/*.deb
            make.log
